[package]
name = "universalrun-recipe-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
universalrun-common = { path = "../common" }
universalrun-analyzer = { path = "../analyzer" }
universalrun-profile-manager = { path = "../profile-manager" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tempfile = "3"
rand = "0.8"

