[package]
name = "universalrun-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "universalrun"
path = "src/main.rs"

[dependencies]
universalrun-common = { path = "../common" }
universalrun-analyzer = { path = "../analyzer" }
universalrun-profile-manager = { path = "../profile-manager" }
universalrun-recipe-engine = { path = "../recipe-engine" }
universalrun-diagnostics = { path = "../diagnostics" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

